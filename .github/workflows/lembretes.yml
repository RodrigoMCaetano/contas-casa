name: Lembrete de vencimento

on:
  schedule:
    - cron: '0 11 * * *'   # todo dia às 11:00 UTC = 08:00 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Enviar uma notificação de teste para todos os celulares'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lembrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/lembretes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTE: ${{ inputs.teste }}
